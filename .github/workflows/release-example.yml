name: Publish example package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: New test version
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: example-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python build_package.py 0.1.0
      - uses: actions/upload-artifact@v6
        with:
          name: example-installer-check
          path: dist/*
  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build text-only fixture
        env:
          EXAMPLE_VERSION: ${{ inputs.version || format('0.1.0-build.{0}', github.run_number) }}
        run: python build_package.py "$EXAMPLE_VERSION"
      - name: Publish complete prerelease
        uses: actions/github-script@v8
        env:
          EXAMPLE_VERSION: ${{ inputs.version || format('0.1.0-build.{0}', github.run_number) }}
        with:
          script: |
            const fs = require('node:fs');
            const version = process.env.EXAMPLE_VERSION;
            if (!/^\d+\.\d+\.\d+(-build\.\d+)?$/.test(version)) throw new Error('Invalid version');
            const tag = `v${version}`;
            const repo = context.repo;
            let ref;
            try { ref = (await github.rest.git.getRef({...repo, ref: `tags/${tag}`})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (ref && ref.object.sha !== context.sha) throw new Error('Tag belongs to another commit');
            if (!ref) await github.rest.git.createRef({...repo, ref: `refs/tags/${tag}`, sha: context.sha});
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error('This version is already published; choose a new version');
            if (!release) release = (await github.rest.repos.createRelease({...repo, tag_name: tag, target_commitish: context.sha,
              name: `Text-only registry example ${version}`, draft: true, prerelease: true,
              body: 'Text-only NEMESIS staging registry fixture. Contains a manifest and README only; no APK, scripts, services, or vehicle configuration. Redistribution permitted for registry testing.'})).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id});
            for (const name of [`nemesis.registry.example-${version}.zip`, 'SHA256SUMS']) {
              const data = fs.readFileSync(`dist/${name}`);
              const existing = assets.find(a => a.name === name);
              if (existing) {
                const remote = await github.rest.repos.getReleaseAsset({...repo, asset_id: existing.id, headers: {accept: 'application/octet-stream'}});
                if (!Buffer.from(remote.data).equals(data)) throw new Error('Existing asset differs; choose a new version');
              } else await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id, name, data,
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, draft: false, prerelease: true});
